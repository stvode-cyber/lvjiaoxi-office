server {
    listen 8444 ssl http2;
    server_name lujax.fun;

    ssl_certificate     /etc/nginx/ssl/lujax.fun.crt;
    ssl_certificate_key /etc/nginx/ssl/lujax.fun.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # releases static feed for auto-update (MUST come before proxy_pass catch-all)
    location /releases/ {
        alias /var/www/lujax.fun/releases/;
        autoindex off;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
