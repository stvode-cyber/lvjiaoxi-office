# XcodeGen spec —— 一行 `xcodegen` 生成 LvjiaoxiOffice.xcodeproj
# 安装：brew install xcodegen
name: LvjiaoxiOffice
options:
  bundleIdPrefix: com.lvjiaoxi
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
targets:
  LvjiaoxiOffice:
    type: application
    platform: iOS
    sources:
      - path: LvjiaoxiOffice
      - path: webroot
        buildPhase: resources
        headerVisibility: none
    info:
      path: LvjiaoxiOffice/Info.plist
      properties:
        UILaunchScreen:
          MinimumOSVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lvjiaoxi.office
        MARKETING_VERSION: 1.0.7
        CURRENT_PROJECT_VERSION: 10007
        INFOPLIST_FILE: LvjiaoxiOffice/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        OTHER_LDFLAGS: []
