name: Build iOS (IPA / xcarchive)

on:
  push:
    branches: [main, master]
    paths:
      - 'clients/ios/**'
      - 'app/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # sync 脚本为纯 Node（仅 fs/path），无需 npm install（避免拉取 Electron 等无关依赖）
      - name: Sync web assets into iOS webroot
        run: node clients/sync-web-assets.js

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: clients/ios
        run: xcodegen generate

      # 默认产出「未签名」xcarchive（CI 无证书时也能验证编译通过）
      - name: Archive (unsigned by default)
        working-directory: clients/ios
        run: |
          xcodebuild -scheme LvjiaoxiOffice -configuration Release \
            -archivePath build/LvjiaoxiOffice.xcarchive archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES

      # 提供签名 secrets 时，导入证书 + 描述文件到临时钥匙串
      - name: Install signing cert & profile (if provided)
        if: ${{ secrets.IOS_CERT_BASE64 != '' }}
        env:
          CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=build.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          echo "$CERT_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          echo "$PROFILE_BASE64" | base64 -d > profile.mobileprovision
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"

      # 仅在有签名时导出 App Store IPA（否则 development/ad-hoc 导出仍需 profile，会失败）
      - name: Export signed IPA (App Store)
        if: ${{ secrets.IOS_CERT_BASE64 != '' }}
        working-directory: clients/ios
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/LvjiaoxiOffice.xcarchive \
            -exportPath build/ipa -exportOptionsPlist ExportOptions.plist

      - name: Upload signed IPA
        if: ${{ secrets.IOS_CERT_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lvjiaoxi-office-ios-ipa
          path: clients/ios/build/ipa/*.ipa

      # 无签名时改传未签名 xcarchive，供本地用自己的证书重签 / TestFlight
      - name: Upload unsigned xcarchive
        if: ${{ secrets.IOS_CERT_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lvjiaoxi-office-ios-xcarchive
          path: clients/ios/build/LvjiaoxiOffice.xcarchive
