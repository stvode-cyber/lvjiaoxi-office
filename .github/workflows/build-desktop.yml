name: Build Desktop (Electron)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

# 每个 Runner 仅构建本机平台；产物（安装包 + latest*.yml）作为 Artifacts 上传。
# 签名可选：提供对应 secrets 即签名，缺失则产出未签名包（可直接验证，但不能直接连商店）。
jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            builder: "--win"
          - os: macos-latest
            platform: mac
            builder: "--mac"
          - os: ubuntu-latest
            platform: linux
            builder: "--linux"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # macOS 需要 .icns（仓库只存 .ico/.png）；用原生 sips+iconutil 从 icon.png 现生成
      - name: Generate macOS icon (.icns)
        if: matrix.platform == 'mac'
        run: |
          mkdir -p app/icons/icon.iconset
          sips -z 16 16    app/icons/icon.png --out app/icons/icon.iconset/icon_16x16.png
          sips -z 32 32    app/icons/icon.png --out app/icons/icon.iconset/icon_32x32.png
          sips -z 64 64    app/icons/icon.png --out app/icons/icon.iconset/icon_32x32@2x.png
          sips -z 128 128  app/icons/icon.png --out app/icons/icon.iconset/icon_128x128.png
          sips -z 256 256  app/icons/icon.png --out app/icons/icon.iconset/icon_128x128@2x.png
          sips -z 256 256  app/icons/icon.png --out app/icons/icon.iconset/icon_256x256.png
          sips -z 512 512  app/icons/icon.png --out app/icons/icon.iconset/icon_256x256@2x.png
          sips -z 512 512  app/icons/icon.png --out app/icons/icon.iconset/icon_512x512.png
          cp app/icons/icon.png app/icons/icon.iconset/icon_512x512@2x.png
          iconutil --convert icns app/icons/icon.iconset --output app/icons/icon.icns
          rm -rf app/icons/icon.iconset

      - name: Install dependencies
        run: npm ci

      # 可选签名：空字符串时 electron-builder 自动回退未签名
      - name: Build (Windows)
        if: matrix.platform == 'win'
        # 仅在提供证书签名 secret 时注入，避免空值被 electron-builder 当文件路径解析崩溃
        shell: bash
        run: |
          if [ -n "${{ secrets.WINDOWS_CSC_LINK }}" ]; then
            export CSC_LINK="${{ secrets.WINDOWS_CSC_LINK }}"
            export CSC_KEY_PASSWORD="${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}"
          fi
          npm run dist:win

      - name: Build (macOS)
        if: matrix.platform == 'mac'
        # 仅在提供证书签名 secret 时注入，避免空值被 electron-builder 当文件路径解析崩溃
        shell: bash
        run: |
          if [ -n "${{ secrets.MAC_CSC_LINK }}" ]; then
            export CSC_LINK="${{ secrets.MAC_CSC_LINK }}"
            export CSC_KEY_PASSWORD="${{ secrets.MAC_CSC_KEY_PASSWORD }}"
          fi
          npm run dist:mac

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: npm run dist:linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lvjiaoxi-office-${{ matrix.platform }}
          path: |
            dist/**/*
            !dist/win-unpacked/**/*
            !dist/mac*/**/*
            !dist/linux*/**/*
          if-no-files-found: error
          retention-days: 30
