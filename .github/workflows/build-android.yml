name: Build Android (APK + AAB)

on:
  push:
    branches: [main, master]
    paths:
      - 'clients/android/**'
      - 'app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk/targetSdk = 35，必须安装 SDK Platform 35 + build-tools 35.0.0
      - name: Install SDK packages & accept licenses
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      # 可选签名：提供 secrets 时解码 keystore 并写入 signing.properties；
      # 缺失则 build.gradle 自动跳过签名，产出未签名包（仅可用于本地测试）。
      # 注意：key 名须与 build.gradle 一致（STORE_FILE 等大写），STORE_FILE 相对 app 模块目录。
      - name: Decode signing keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p clients/android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > clients/android/keystore/lvjiaoxi-release.keystore
          cat > clients/android/signing.properties <<EOF
          STORE_FILE=../keystore/lvjiaoxi-release.keystore
          STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # 注：Android 直接通过 build.gradle 的 assets.srcDirs 映射仓库根 app/，无需同步脚本
      - name: Build Release APK + AAB
        working-directory: clients/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lvjiaoxi-office-android-apk
          path: clients/android/app/build/outputs/apk/release/*.apk

      # Play 上架用 AAB（应用包），配合 Play App Signing 上传
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: lvjiaoxi-office-android-aab
          path: clients/android/app/build/outputs/bundle/release/*.aab
