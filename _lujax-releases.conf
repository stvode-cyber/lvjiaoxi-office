# Lvjiaoxi Office auto-update feed
server {
    listen 8444 ssl http2;
    server_name lujax.fun;

    ssl_certificate     /etc/nginx/ssl/lujax.fun.crt;
    ssl_certificate_key /etc/nginx/ssl/lujax.fun.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # /releases static (installers + latest.yml) - BEFORE proxy_pass
    location /releases/ {
        alias /var/www/lujax.fun/releases/;
        autoindex off;
        add_header Cache-Control "no-cache";
        access_log off;
    }
}
